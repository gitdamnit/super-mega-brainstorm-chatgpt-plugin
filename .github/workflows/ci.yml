name: Plugin and skill CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin manifest and directory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("plugin.json").read_text())
          c = json.loads(Path(".codex-plugin/plugin.json").read_text())
          assert p["name"] == "super-mega-brainstorm"
          assert p["version"] == c["version"] == "0.2.0"
          assert c["name"] == p["name"]
          assert c["skills"] == "./skills"
          assert Path("skills/super-mega-brainstorm-skill/SKILL.md").is_file()
          print("Plugin manifests and directory OK")
          PY
      - name: Run full skill checks
        working-directory: skills/super-mega-brainstorm-skill
        run: bash tests/run_tests.sh
